name: personal-toolbox

services:
  web:
    image: personal-toolbox-web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-个人工具箱}
        VITE_APP_SHORT_NAME: ${VITE_APP_SHORT_NAME:-工具箱}
        VITE_APP_DESCRIPTION: ${VITE_APP_DESCRIPTION:-常用开发、文件、图片与文档工具}
        VITE_API_BASE_URL: /api
        VITE_REPOSITORY_URL: ${VITE_REPOSITORY_URL:-https://github.com/Fffgfjh/personal-toolbox}
        VITE_OWNER_NAME: ${VITE_OWNER_NAME:-Fffgfjh}
        VITE_OWNER_URL: ${VITE_OWNER_URL:-https://github.com/Fffgfjh}
        VITE_SUPPORT_URL: ${VITE_SUPPORT_URL:-}
    container_name: personal-toolbox-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8454}:8080"
    read_only: true
    init: true
    restart: unless-stopped
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=16m,mode=1777
    networks:
      - app
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: personal-toolbox-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: personal-toolbox-api
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://tool.766113.xyz}
      DOCUMENT_SERVICE_BASE_URL: ${DOCUMENT_SERVICE_BASE_URL:-http://stirling-pdf:8080}
      DOCUMENT_SERVICE_API_KEY: ${DOCUMENT_SERVICE_API_KEY:-}
      DOCUMENT_SERVICE_TIMEOUT_MS: ${DOCUMENT_SERVICE_TIMEOUT_MS:-180000}
      DOCUMENT_SERVICE_MAX_CONCURRENCY: ${DOCUMENT_SERVICE_MAX_CONCURRENCY:-1}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-262144000}
      MAX_OUTPUT_BYTES: ${MAX_OUTPUT_BYTES:-262144000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-300000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    expose:
      - "3001"
    read_only: true
    init: true
    restart: unless-stopped
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - app
      - control-plane
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app:
    name: personal-toolbox_app
    internal: true
  control-plane:
    external: true
    name: control-plane_default
